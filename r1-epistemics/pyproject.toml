[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r1epi"
version = "0.1.0"
description = "Do reasoning LLMs internally know when they hallucinate? Probing DeepSeek-R1-Distill-7B."
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn", "matplotlib", "tqdm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
